name: UsageTracker

options:
  bundleIdPrefix: com.pixybyteco
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  UsageTrackerCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/UsageTrackerCore
    settings:
      base:
        DEFINES_MODULE: YES

  UsageTracker:
    type: application
    platform: macOS
    sources:
      - Sources/UsageTracker
    dependencies:
      - target: UsageTrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixybyteco.usagetracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  UsageTrackerCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UsageTrackerCoreTests
    dependencies:
      - target: UsageTrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixybyteco.usagetracker.coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UsageTracker:
    build:
      targets:
        UsageTracker: all
        UsageTrackerCoreTests: [test]
    run:
      config: Debug
    test:
      targets:
        - UsageTrackerCoreTests
